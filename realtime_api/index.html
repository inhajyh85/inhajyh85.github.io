<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리동네 날씨 & 미세먼지</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #3b82f6;
    --g0: #3b82f6; /* 좋음 */
    --g1: #22c55e; /* 보통 */
    --g2: #f97316; /* 나쁨 */
    --g3: #ef4444; /* 매우나쁨 */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --card: #151e2e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --line: #263248;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 40px;
  }
  .wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .place { font-size: 1.35rem; font-weight: 700; line-height: 1.3; word-break: keep-all; }
  .updated { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
  .notice { font-size: 0.8rem; color: var(--g2); margin-top: 4px; }
  button {
    flex-shrink: 0;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
  }
  .label { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }

  .weather-main { display: flex; align-items: center; gap: 16px; }
  .w-icon { font-size: 3.4rem; line-height: 1; }
  .w-temp { font-size: 2.6rem; font-weight: 800; letter-spacing: -1px; }
  .w-desc { font-size: 1rem; color: var(--muted); }
  .w-stats {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  .stat .k { font-size: 0.78rem; color: var(--muted); }
  .stat .v { font-size: 1.05rem; font-weight: 600; margin-top: 2px; }

  .air { border: none; color: #fff; transition: background .3s; }
  .air .label { color: rgba(255,255,255,.85); }
  .air-total { font-size: 2rem; font-weight: 800; }
  .air-rows { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .air-row {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,.18); border-radius: 12px; padding: 10px 14px;
  }
  .air-row .name { font-weight: 600; }
  .air-row .name small { font-weight: 400; opacity: .85; margin-left: 4px; }
  .air-row .val { font-weight: 700; }

  .alert {
    display: none;
    background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
    border-radius: 14px; padding: 14px 16px; font-weight: 700; text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    .alert { background: #3b1414; color: #fecaca; border-color: #7f1d1d; }
  }
  .alert.show { display: block; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.02); } }

  .err { color: var(--g3); font-size: 0.9rem; }
  .skeleton { color: var(--muted); }
  footer { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="place" id="place">📍 위치 확인 중…</div>
      <div class="updated" id="updated">불러오는 중…</div>
      <div class="notice" id="notice"></div>
    </div>
    <button id="refresh" type="button">↻ 새로고침</button>
  </header>

  <div class="alert" id="alert"></div>

  <section class="card" id="weather">
    <div class="label">현재 날씨</div>
    <div class="skeleton">날씨 정보를 불러오는 중…</div>
  </section>

  <section class="card air" id="air" style="background: var(--muted)">
    <div class="label">미세먼지</div>
    <div>미세먼지 정보를 불러오는 중…</div>
  </section>

  <footer>
    10분마다 자동 갱신 · 미세먼지 등급은 환경부 기준<br>
    Weather &amp; Air data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> ·
    Location by <a href="https://www.bigdatacloud.com/" target="_blank" rel="noopener">BigDataCloud</a>
  </footer>
</div>

<script>
const DEFAULT = { lat: 37.5665, lon: 126.978, isDefault: true }; // 서울시청
const REFRESH_MS = 10 * 60 * 1000;

const $ = (id) => document.getElementById(id);

// WMO 날씨 코드 → [이모지, 설명]
function weatherInfo(code) {
  if (code === 0) return ["☀️", "맑음"];
  if ([1, 2].includes(code)) return ["🌤️", "구름 조금"];
  if (code === 3) return ["☁️", "흐림"];
  if ([45, 48].includes(code)) return ["🌫️", "안개"];
  if ([51, 53, 55, 56, 57].includes(code)) return ["🌦️", "이슬비"];
  if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return ["🌧️", "비"];
  if ([71, 73, 75, 77, 85, 86].includes(code)) return ["🌨️", "눈"];
  if ([95, 96, 99].includes(code)) return ["⛈️", "뇌우"];
  return ["🌡️", "알 수 없음"];
}

// 환경부 기준 등급: 0=좋음 1=보통 2=나쁨 3=매우나쁨
const GRADES = [
  { name: "좋음", emoji: "😊", color: "var(--g0)" },
  { name: "보통", emoji: "🙂", color: "var(--g1)" },
  { name: "나쁨", emoji: "😷", color: "var(--g2)" },
  { name: "매우나쁨", emoji: "🚨", color: "var(--g3)" },
];
const gradePM10 = (v) => (v <= 30 ? 0 : v <= 80 ? 1 : v <= 150 ? 2 : 3);
const gradePM25 = (v) => (v <= 15 ? 0 : v <= 35 ? 1 : v <= 75 ? 2 : 3);

function getPosition() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(DEFAULT);
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, isDefault: false }),
      () => resolve(DEFAULT),
      { timeout: 8000, maximumAge: 5 * 60 * 1000 }
    );
  });
}

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderPlace(place, pos) {
  if (place) {
    const region = place.principalSubdivision || place.city || "";
    const local = place.locality && place.locality !== region ? place.locality : "";
    $("place").textContent = "📍 " + ([region, local].filter(Boolean).join(" ") || "내 위치");
  } else {
    $("place").textContent = "📍 " + (pos.isDefault ? "서울시청 부근" : "내 위치");
  }
  $("notice").textContent = pos.isDefault
    ? "위치 권한이 없어 서울시청 기준으로 보여드려요."
    : "";
}

function renderWeather(c) {
  const box = $("weather");
  box.replaceChildren(el("div", "label", "현재 날씨"));
  if (!c) {
    box.append(el("div", "err", "날씨 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요."));
    return;
  }
  const [icon, desc] = weatherInfo(c.weather_code);

  const main = el("div", "weather-main");
  main.append(el("div", "w-icon", icon));
  const right = el("div");
  right.append(el("div", "w-temp", c.temperature_2m.toFixed(1) + "°C"));
  right.append(el("div", "w-desc", desc + " · 체감 " + c.apparent_temperature.toFixed(1) + "°C"));
  main.append(right);

  const stats = el("div", "w-stats");
  [
    ["습도", c.relative_humidity_2m + "%"],
    ["바람", c.wind_speed_10m.toFixed(1) + " km/h"],
    ["강수", c.precipitation + " mm"],
    ["기준 시각", c.time.slice(11, 16)],
  ].forEach(([k, v]) => {
    const s = el("div", "stat");
    s.append(el("div", "k", k), el("div", "v", v));
    stats.append(s);
  });

  box.append(main, stats);
}

function renderAir(a) {
  const box = $("air");
  const alertBox = $("alert");
  box.replaceChildren(el("div", "label", "미세먼지"));
  if (!a || a.pm10 == null || a.pm2_5 == null) {
    box.style.background = "var(--muted)";
    box.append(el("div", null, "미세먼지 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요."));
    alertBox.classList.remove("show");
    return;
  }
  const g10 = gradePM10(a.pm10);
  const g25 = gradePM25(a.pm2_5);
  const total = Math.max(g10, g25);
  const G = GRADES[total];

  box.style.background = G.color;
  box.append(el("div", "air-total", G.emoji + " " + G.name));

  const rows = el("div", "air-rows");
  [
    ["미세먼지", "PM10", a.pm10, g10],
    ["초미세먼지", "PM2.5", a.pm2_5, g25],
  ].forEach(([name, code, v, g]) => {
    const row = el("div", "air-row");
    const n = el("span", "name", name);
    n.append(el("small", null, code));
    row.append(n, el("span", "val", Math.round(v) + " μg/m³ · " + GRADES[g].name));
    rows.append(row);
  });
  box.append(rows);

  if (total >= 2) {
    alertBox.textContent = total === 3
      ? "🚨 미세먼지 매우나쁨! 외출을 자제하고 꼭 마스크를 쓰세요."
      : "😷 미세먼지 나쁨! 외출할 때 마스크 챙기세요.";
    alertBox.classList.add("show");
  } else {
    alertBox.classList.remove("show");
  }
}

let loading = false;
async function load() {
  if (loading) return;
  loading = true;
  $("refresh").disabled = true;
  $("updated").textContent = "불러오는 중…";

  try {
    const pos = await getPosition();
    const q = `latitude=${pos.lat}&longitude=${pos.lon}`;

    // 하나가 실패해도 나머지는 표시되도록 allSettled 사용
    const [place, weather, air] = await Promise.allSettled([
      getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?${q}&localityLanguage=ko`),
      getJSON(`https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,precipitation&timezone=Asia%2FSeoul`),
      getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,pm2_5&timezone=Asia%2FSeoul`),
    ]);

    renderPlace(place.status === "fulfilled" ? place.value : null, pos);
    renderWeather(weather.status === "fulfilled" ? weather.value.current : null);
    renderAir(air.status === "fulfilled" ? air.value.current : null);

    const now = new Date();
    $("updated").textContent = "마지막 갱신: " +
      now.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  } finally {
    loading = false;
    $("refresh").disabled = false;
  }
}

$("refresh").addEventListener("click", load);
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
